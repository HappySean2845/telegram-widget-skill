[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tgwidget"
version = "0.1.0"
description = "Check, render and send Telegram HTML widgets (Bot API 10.4) from AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["quickjs>=1.19"]

[project.optional-dependencies]
render = ["playwright>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
tgwidget = "tgwidget.cli:main"

[project.urls]
Homepage = "https://github.com/HappySean2845/telegram-widget-skill"

[tool.setuptools]
package-dir = { "" = "scripts" }
packages = ["tgwidget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
