name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # 3.9 is what macOS ships as python3; newer Ubuntu images no longer carry it
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Examples pass the checker through the launcher, without installing
        run: |
          for f in examples/*.html; do
            python scripts/widget.py check "$f" --chat-data "@${f%.html}.json" --text
          done

  no-engine:
    # no quickjs, no node: the structural fallback must still work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Tests with only Python on the PATH
        run: |
          export PATH="$(dirname "$(command -v python)"):/usr/bin:/bin"
          if command -v node; then echo "node is still on the PATH"; exit 1; fi
          python -m pytest -q tests/test_engines.py tests/test_send.py

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,render]"
      # No --with-deps: the runner image already has Chrome's system libraries, and apt mirrors
      # on the runner are a point of failure we do not need (ubuntu-26.04 could not resolve
      # archive.ubuntu.com for hours on 2026-11-11).
      - run: python -m playwright install chromium
      - run: pytest -q tests/test_render.py
      - name: Screenshots of the examples
        run: |
          mkdir -p shots
          for f in examples/*.html; do
            b=$(basename "${f%.html}")
            tgwidget render "$f" --chat-data "@${f%.html}.json" --out "shots/$b.png" --scheme dark
          done
      - uses: actions/upload-artifact@v5
        with:
          name: example-screenshots
          path: shots/
